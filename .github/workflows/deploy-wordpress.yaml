name: Deploy WordPress

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy from"
        required: true
        default: "feature-complete"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ragu
          chmod 600 ~/.ssh/id_ragu
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create directory and copy compose file
        run: |
          ssh -i ~/.ssh/id_ragu ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/ragu"
          scp -i ~/.ssh/id_ragu compose.prod.yaml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/ragu/compose.prod.yaml

      - name: Generate .env on server
        run: |
          ssh -i ~/.ssh/id_ragu ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/ragu
            > .env
            echo 'DATABASE_NAME=${{ vars.DATABASE_NAME }}' >> .env
            echo 'DATABASE_USER=${{ vars.DATABASE_USER }}' >> .env
            echo 'DATABASE_PASSWORD=${{ vars.DATABASE_PASSWORD }}' >> .env
            echo 'DATABASE_ROOT_PASSWORD=${{ vars.DATABASE_ROOT_PASSWORD }}' >> .env
            echo 'DOMAIN=${{ vars.DOMAIN }}' >> .env
            echo 'ACME_EMAIL=${{ vars.ACME_EMAIL }}' >> .env
            echo 'TRAEFIK_ADMIN_USER=${{ vars.TRAEFIK_ADMIN_USER }}' >> .env
            echo 'TRAEFIK_ADMIN_PASSWORD_HASH=${{ secrets.TRAEFIK_ADMIN_PASSWORD_HASH }}' >> .env
            echo 'WORDPRESS_ADMIN_EMAIL=${{ vars.WORDPRESS_ADMIN_EMAIL }}' >> .env
            chmod 600 .env
          "

      - name: Login to GHCR on server
        run: |
          ssh -i ~/.ssh/id_ragu ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ragu ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/ragu
            docker compose -p ragu -f compose.prod.yaml pull
            docker compose -p ragu -f compose.prod.yaml down --remove-orphans
            docker compose -p ragu -f compose.prod.yaml up -d
            sleep 15
          "

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_ragu ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/ragu
            docker compose -p ragu -f compose.prod.yaml ps
          "
