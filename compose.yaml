# Docker Compose — Development
#
# Единая точка входа: http://localhost:8080 (Traefik)
#   ├── /wp-admin, /wp-json, /graphql, /wp-content, ... → WordPress
#   └── всё остальное                                   → Next.js фронтенд
# Порты 3000 и 80 наружу не публикуются — только внутри Docker-сети.
services:
    traefik:
        image: traefik:v2.11
        restart: unless-stopped
        command:
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:80
        ports:
            - "8080:80"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - dev-network
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "0.5"

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DATABASE_NAME}
            MYSQL_USER: ${DATABASE_USER}
            MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
            MYSQL_PASSWORD: ${DATABASE_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - dev-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"

    wordpress:
        depends_on:
            db:
                condition: service_healthy
        build:
            context: .
            dockerfile: Dockerfile.wordpress
            target: development
        restart: unless-stopped
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: ${DATABASE_USER}
            WORDPRESS_DB_PASSWORD: ${DATABASE_PASSWORD}
            WORDPRESS_DB_NAME: ${DATABASE_NAME}
            WORDPRESS_URL: ${WORDPRESS_URL}
            WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
        volumes:
            # WP-файлы сохраняются между перезапусками (плагины ставятся через wp-cli при первом запуске)
            - wp_data:/var/www/html
            # Hot-reload: изменения на хосте сразу видны в контейнере
            - ./wordpress/themes/ragu:/var/www/html/wp-content/themes/ragu
            - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.wordpress.rule=(Host(`localhost`) || Host(`127.0.0.1`)) && (PathPrefix(`/wp-admin`) || Path(`/wp-login.php`) || PathPrefix(`/wp-json`) || PathPrefix(`/graphql`) || PathPrefix(`/wp-content`) || PathPrefix(`/wp-includes`) || Path(`/wp-cron.php`) || Path(`/xmlrpc.php`) || PathPrefix(`/sitemap`))"
            - "traefik.http.routers.wordpress.entrypoints=web"
            - "traefik.http.services.wordpress.loadbalancer.server.port=80"
        networks:
            - dev-network
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/wordpress-setup-complete"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 90s
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"

    frontend:
        depends_on:
            wordpress:
                condition: service_healthy
        build:
            context: .
            dockerfile: Dockerfile.frontend
            target: development
        restart: unless-stopped
        environment:
            # Server-side: GraphQL и SEO API ходят по внутренней docker-сети
            SCHEMA_URL: http://wordpress/graphql
            # Next.js (SSR) грузит оригиналы картинок с WP по внутренней сети;
            # браузеру они отдаются уже через оптимизатор Next
            NEXT_PUBLIC_WORDPRESS_API_URL: http://wordpress
        volumes:
            # Hot-reload: изменения на хосте сразу видны в контейнере
            - ./src:/usr/app/src
            - ./public:/usr/app/public
            - ./next.config.ts:/usr/app/next.config.ts
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.frontend.rule=(Host(`localhost`) || Host(`127.0.0.1`))"
            - "traefik.http.routers.frontend.entrypoints=web"
            - "traefik.http.services.frontend.loadbalancer.server.port=3000"
        networks:
            - dev-network

volumes:
    db_data:
        name: ragu-db-data
    wp_data:
        name: ragu-wp-data

networks:
    dev-network:
        driver: bridge
