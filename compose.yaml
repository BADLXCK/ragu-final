# Docker Compose — Development
services:
    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DATABASE_NAME}
            MYSQL_USER: ${DATABASE_USER}
            MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
            MYSQL_PASSWORD: ${DATABASE_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - dev-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"

    wordpress:
        depends_on:
            db:
                condition: service_healthy
        build:
            context: .
            dockerfile: Dockerfile.wordpress
            target: development
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: ${DATABASE_USER}
            WORDPRESS_DB_PASSWORD: ${DATABASE_PASSWORD}
            WORDPRESS_DB_NAME: ${DATABASE_NAME}
            WORDPRESS_URL: ${WORDPRESS_URL}
            WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
        volumes:
            # WP-файлы сохраняются между перезапусками (baked-плагины попадают сюда при первом запуске)
            - wp_data:/var/www/html
            # Hot-reload: изменения на хосте сразу видны в контейнере
            - ./wordpress/themes/ragu:/var/www/html/wp-content/themes/ragu
            - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
        networks:
            - dev-network
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/wordpress-setup-complete"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 90s
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"

volumes:
    db_data:
        name: ragu-db-data
    wp_data:
        name: ragu-wp-data

networks:
    dev-network:
        driver: bridge
